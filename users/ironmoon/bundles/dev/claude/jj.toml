#:schema https://docs.jj-vcs.dev/latest/config-schema.json

# jj's next snapshot folds stray edits into a pushed working copy, so a push from a session would send it stale (friction 133)
[[--scope]]
--when.environments = ["CLAUDECODE"]
[--scope.git]
private-commits = "working_copies()"

# default.nix reads this scope again to give git the same identity in the same repos
[[--scope]]
--when.environments = ["CLAUDECODE"]
--when.repositories = [
  "~/workspace/autograder",
  "~/workspace/claude",
  "~/workspace/codex",
  "~/workspace/common",
  "~/workspace/health",
  "~/workspace/redox",
  "~/workspace/richwasm",
  "~/workspace/sandbox",
  "~/workspace/spytial",
  "~/research/gradual-borrows",
]
[--scope.user]
name = "ironmoon's agent"
email = "agent@ironmoon.dev"
[--scope.signing]
key = "agent@ironmoon.dev"
backends.gpg.program = "agent-gpg"

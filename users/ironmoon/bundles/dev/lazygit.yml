# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
gui:
  showRandomTip: false
  tabWidth: 2
git:
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: |
        delta --syntax-theme="Visual Studio Dark+" --tabs=2 \
        --paging=never --line-numbers \
        --line-numbers-left-format="" --line-numbers-right-format="{np:<4}" \
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  # change --pretty=medium to --pretty=fuller
  # TODO: do we want this? 
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=fuller {{branchName}} --
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=fuller
os:
  editPreset: "nvim"
promptToReturnFromSubprocess: false
customCommands:
  - key: n
    context: files
    command: "git add -N {{.SelectedFile.Name | quote}}"
    description: "Mark file as intent-to-add"
  - key: '<c-s>'
    context: files
    command: "printf '\e[0m'; git diff --color=always --stat {{.SelectedPath | quote}}"
    output: popup
    description: "View git diff stat"
    outputTitle: "Diff Stats"
  # copied from docs:
  - key: 'P'
    command: "git push {{.SelectedRemote.Name}} {{.SelectedLocalCommit.Sha}}:{{.SelectedLocalBranch.Name}}"
    context: "commits"
    loadingText: "Pushing commit..."
    description: "Push a specific commit (and any preceding)"

# notes:
# - <c-w> to toggle ignoring whitespace
# - <c-l> to change 

[package]
name = "outlook-sync"
version = "0.1.0"
description = "One Microsoft 365 calendar mirrored into one Stalwart calendar, by Graph change notifications"
edition.workspace = true
rust-version.workspace = true
autotests = false

[[bin]]
name = "outlook-sync"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
form_urlencoded.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["http1"] }
jiff.workspace = true
jmap.workspace = true
oidc.workspace = true
private.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
yakery-log.workspace = true
yakery-serve.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["agent-mail", "slurm-ci", "scheduler", "lib/text", "lib/private", "lib/log"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
getrandom = { version = "0.4", features = ["std"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = { version = "2.6", default-features = false }
tempfile = "3"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo", "serde"] }
maud = "0.27"
ring = "0.17"
tokio = "1"

text = { path = "lib/text" }
private = { path = "lib/private" }
yakery-log = { path = "lib/log" }

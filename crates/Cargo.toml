[workspace]
resolver = "3"
members = ["agent-mail", "slurm-ci", "scheduler", "lib/text", "lib/private", "lib/log"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
form_urlencoded = "1"
getrandom = { version = "0.4", features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo", "serde"] }
libc = "0.2"
lol_html = "3"
maud = "0.27"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "cookies", "json", "form"] }
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = { version = "2.6", default-features = false }
tempfile = "3"
tokio = "1"

text = { path = "lib/text" }
private = { path = "lib/private" }
yakery-log = { path = "lib/log" }

[workspace]
resolver = "3"
members = ["agent-mail", "slurm-ci", "lib/text"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

text = { path = "lib/text" }

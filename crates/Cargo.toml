[workspace]
resolver = "3"
members = [
    "agent-mail",
    "slurm-ci",
    "agent-proto",
    "agentd",
    "agent-host",
    "submission-signature",
    "submission-signer",
    "lib/text",
    "lib/private",
    "lib/log",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
base16ct = { version = "1", features = ["alloc"] }
base64 = "0.23"
blake3 = { version = "1", features = ["pure"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
getrandom = { version = "0.4", features = ["std"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
lol_html = "3"
mail-parser = "0.11"
nix = { version = "0.30", features = ["fs", "mount", "process", "sched", "signal", "user"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "cookies", "json", "form"] }
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
subtle = { version = "2.6", default-features = false }
tempfile = "3"
tokio = "1"
tokio-vsock = "0.7"
toml = "0.8"

agent-proto = { path = "agent-proto" }
text = { path = "lib/text" }
private = { path = "lib/private" }
submission-signature = { path = "submission-signature" }
yakery-log = { path = "lib/log" }

[package]
name = "slurm-ci"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["fs", "mount", "process", "sched", "signal", "user"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "slurm-ci"
path = "src/main.rs"

[lib]
name = "slurm_ci"
path = "src/lib.rs"

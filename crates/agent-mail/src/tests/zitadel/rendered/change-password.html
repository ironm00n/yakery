<div class="lgn-head">
    <h1>Change Password</h1>
    <div class="lgn-login-profile">
    <div class="lgn-profile-image"></div>
    <div class="lgn-names">
        <div class="inline-block">
            <div class="lgn-avatar lgn-primary" loginname="agent@example.org">
                    <span class="initials lgn-primary">A</span>
            </div>
        </div>
        <div class="lgn-loginname">
            <p>agent@example.org</p>
        </div>

    </div>
</div>

    <p>You password has expired and has to be changed. Enter your old and new password.</p>
</div>

<form action="/ui/login/password/change" method="POST">

    <input type="hidden" name="gorilla.csrf.Token" value="hQ3pKz8sVb1mXw0yRt5uLc7nJe2gFa9dOi4kMv6qYs3xBh0lNp8rTw1zUc5eGj2fAk7mDo9iSb4vXn6yQ==">

    <input type="hidden" name="authRequestID" value="396425044525318236" />
    <input type="text" name="loginName" value="agent@example.org" autocomplete="username" class="hidden" />

    <div class="fields">
        <div class="field">
            <label class="lgn-label" for="change-old-password">Old Password</label>
            <input class="lgn-input" type="password" id="change-old-password" name="change-old-password"
                autocomplete="current-password" autofocus required>
        </div>

        <div class="field">
            <label class="lgn-label" for="change-new-password">New Password</label>
            <input data-minlength="8" data-has-uppercase="true"
                data-has-lowercase="true" data-has-number="true"
                data-has-symbol="true" class="lgn-input" type="password" id="change-new-password"
                name="change-new-password" autocomplete="new-password" required>
        </div>

        <div class="field">
            <label class="lgn-label"
                for="change-password-confirmation">Password confirmation</label>
            <input class="lgn-input" type="password" id="change-password-confirmation"
                name="change-password-confirmation" autocomplete="new-password" required>
            <ul class="lgn-no-dots lgn-policy" id="passwordcomplexity">
                <li id="minlength" class="invalid"><i class="lgn-icon-times-solid lgn-warn"></i><span>Must be at least 8 characters long.</span></li>
                <li id="maxlength" class="valid"><i class="lgn-icon-check-solid lgn-valid"></i><span>Must be less than 70 characters long.</span></li>
                <li id="confirmation" class="invalid"><i class="lgn-icon-times-solid lgn-warn"></i><span>Password confirmation matched.</span></li>
            </ul>
        </div>
    </div>

    <div class="lgn-actions">
        <a class="lgn-stroked-button" href="/ui/login/login">
            Cancel
        </a>
        <span class="fill-space"></span>
        <button type="submit" id="change-password-button" name="resend" value="false"
            class="lgn-raised-button lgn-primary">Next</button>
    </div>
</form>

[package]
name = "agent-mail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
futures-util = "0.3"
getrandom = { version = "0.4", features = ["std"] }
jmap-client = { version = "0.4", default-features = false, features = ["async"] }
libc = "0.2"
lol_html = "3"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "form"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

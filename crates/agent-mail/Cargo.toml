[package]
name = "agent-mail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.56", default-features = false }
getrandom = { version = "0.4", features = ["std"] }
http-body = "1"
libc = "0.2"
lol_html = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "cookies", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["test-util"] }

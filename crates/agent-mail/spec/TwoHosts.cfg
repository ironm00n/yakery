CONSTANTS
    s1 = s1  s2 = s2  h1 = h1  h2 = h2  m1 = m1  m2 = m2  t1 = t1  t2 = t2
    Sessions <- MCSessions
    Hosts <- MCHosts
    Mails <- MCMails
    Threads <- MCThreads
    InitThread <- MCInitThread
    Watch <- MCWatch
    HostOf <- TwoHosts
    MaxCrashes = 1
    LostReplies = TRUE
SPECIFICATION Spec
\* Delivery once per host and one receipt per mail hold with two hosts, since only the claim whose $mdnsent
\* wrote sends one; Once holds too without lost replies (TwoHostsExclusive.cfg), and fails with them (TwoHostsOnce.cfg).
INVARIANTS TypeOK AnsweredOnlyByReply OncePerHost OneReceipt
PROPERTIES NoLoss
